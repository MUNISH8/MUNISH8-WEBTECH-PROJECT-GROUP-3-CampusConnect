<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campus Connect login</title>
        <link rel="stylesheet" href="Css/style.css">
    </head>
    <body>
        <div class="container">
                  <div class="logo-section">
            <a href="dashboard.html">
                <img src="Images/campusconnect-high-resolution-logo.png"
                     alt="CampusConnect Logo" class="logo">
            </a>
                <h2>CampusConnect</h2>
            </div> 
            

            <h1>Welcome back</h1>
            <p class="subtitle">Sign in with your University email.</p>

            <form id="loginForm" novalidate>
                <label for="email">University email<span>*</span></label>
                <input type="email" id="email" placeholder="you@university.edu" required>

                <label for="password">Password<span>*</span></label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <p id="message" class="error"></p>

                <button type="submit">Sign In</button>
            </form>

            <p class="register">
                New here?
                <a href="register.html">Create an Account</a>
            </p>

            <p class="note">
                Prototype: any email ending in university.edu works.
                Start it with "admin" for the admin view.
            </p>
        </div>

        <script src="Javascript/login.js"></script>
    </body>
</html>
