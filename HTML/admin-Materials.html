<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect Admin Materials</title>
    <link rel="stylesheet" href="../CSS/admin-Materials.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo-section">
            <a href="admin-dashboard.html">
                <img src="../Image/campusconnect-high-resolution-logo.png"
                     alt="CampusConnect Logo" class="logo">
            </a>
            <h2>CampusConnect</h2>
        </div>

        <nav class="nav-links">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="admin-Materials.html" class="active">Materials</a>
            <a href="admin-events.html">Events</a>
            <a href="admin.html">Notice</a>
        </nav>

        <div class="user-section">
            <span class="admin-badge">Admin</span>
            <span>Administrator</span>
            <a href="login.html" class="logout">Logout</a>
        </div>

    </header>


    <!-- Main Content -->

    <main class="main">

        <div class="heading-section">

            <div>
                <h1>Manage Materials</h1>
                <p class="subtitle">
                    Upload, manage and remove course materials.
                </p>
            </div>

            <button id="createBtn" class="create-btn">
                + Upload Material
            </button>

        </div>


        <!-- Upload Form -->

        <form id="materialForm" hidden>

            <h2>Upload New Material</h2>

            <label for="title">Title</label>
            <input type="text" id="title" required>

            <label for="code">Course Code</label>
            <input type="text" id="code" placeholder="e.g. CSE 2211" required>

            <label for="dept">Department</label>
            <select id="dept">
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="IPE">IPE</option>
                <option value="ENGLISH">ENGLISH</option>
                <option value="LLB">LLB</option>
            </select>

            <label for="sem">Semester</label>
            <select id="sem">
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <label for="type">File Type</label>
            <select id="type">
                <option value="pdf">PDF</option>
                <option value="pptx">PPTX</option>
                <option value="docx">DOCX</option>
            </select>

            <label for="file">File</label>
            <input type="file" id="file">

            <button type="submit">Save Material</button>

            <button type="button" id="cancelBtn">Cancel</button>

        </form>


        <!-- Search and Filter -->

        <div class="toolbar">

            <input type="search"
                   id="searchBox"
                   placeholder="Search by title or course code">

            <select id="deptFilter">
                <option value="">All Departments</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="IPE">IPE</option>
                <option value="ENGLISH">ENGLISH</option>
                <option value="LLB">LLB</option>
            </select>

            <select id="semFilter">
                <option value="">All Semesters</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <select id="typeFilter">
                <option value="">All Types</option>
                <option value="pdf">PDF</option>
                <option value="pptx">PPTX</option>
                <option value="docx">DOCX</option>
            </select>

        </div>


        <!-- Material Cards -->

<div class="material-grid" id="materialGrid"></div>

        <p id="noResult" class="subtitle" hidden>No materials found.</p>

    </main>

    <script src="../JavaScript/admin-Materials.js"></script>

</body>
</html>
