<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect Materials</title>
    <link rel="stylesheet" href="../CSS/Materials.css">
</head>

<body>

    <header class="navbar">

        <div class="logo-section">
            <a href="dashboard.html">
                <img src="../Image/campusconnect-high-resolution-logo.png"
                     alt="CampusConnect Logo" class="logo">
            </a>
            <h2>CampusConnect</h2>
        </div>

        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="Materials.html" class="active">Materials</a>
            <a href="events.html">Events</a>
            <a href="notice.html">Notice</a>
        </nav>

        <div class="user-section">
            <span>Samia Afroze</span>
            <a href="login.html" class="logout">Logout</a>
        </div>

    </header>

    <main class="main">

        <h1>Course Materials</h1>

        <p class="subtitle">
            Find and download lecture notes, slides and past questions.
        </p>

        <div class="toolbar">

            <input type="search"
                   id="searchBox"
                   placeholder="Search by title or course code">

            <select id="deptFilter">
                <option value="">All Departments</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="IPE">IPE</option>
                <option value="ENGLISH">ENGLISH</option>
                <option value="LLB">LLB</option>
            </select>

            <select id="semFilter">
                <option value="">All Semesters</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <select id="typeFilter">
                <option value="">All Types</option>
                <option value="pdf">PDF</option>
                <option value="pptx">PPTX</option>
                <option value="docx">DOCX</option>
            </select>

        </div>

<div class="material-grid" id="materialGrid"></div>

        <p id="noResult" class="subtitle" hidden>No materials found.</p>

    </main>

    <script src="../JavaScript/Materials.js"></script>
</body>
</html>
