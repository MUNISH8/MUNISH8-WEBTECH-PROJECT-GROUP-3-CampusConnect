<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campus Connect Register</title>
        <link rel="stylesheet" href="../CSS/register.css">
    </head>
    <body>
        <div class="container">

            <div class="logo-section">
                <a href="dashboard.html">
                <img src="../Image/campusconnect-high-resolution-logo.png"
                     alt="CampusConnect Logo" class="logo">
            </a>
                <h2>CampusConnect</h2>
            </div>

            <h1>Create your account</h1>
            <p class="subtitle">Register with your university details.</p>

            <form id="registerForm" novalidate>

                <label for="name">Full name<span>*</span></label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">University email<span>*</span></label>
                <input type="email" id="email" placeholder="you@university.edu" required>

                <label for="studentId">Student ID<span>*</span></label>
                <input type="text" id="studentId" placeholder="Enter your student ID" required>

                <label for="department">Department<span>*</span></label>
                <select id="department" required>
                    <option value="">Select an option</option>
                    <option value="CSE">CSE</option>
                    <option value="EEE">EEE</option>
                    <option value="BBA">BBA</option>
                    <option value="IPE">IPE</option>
                    <option value="ENGLISH">ENGLISH</option>
                    <option value="LLB">LLB</option>
                </select>

                <label for="password">Password<span>*</span></label>
                <input type="password" id="password" placeholder="At least 8 characters" required>

                <label for="confirmPassword">Confirm password<span>*</span></label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

                <p id="message" class="error"></p>

                <button type="submit">Register</button>

            </form>

            <p class="register">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <p class="note">
                Prototype: any email ending in university.edu works.
            </p>

        </div>

        <script src="../JavaScript/register.js"></script>
    </body>
</html>
