
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect Admin Panel</title>
    <link rel="stylesheet" href="../CSS/events.css">
    <link rel="stylesheet" href="../CSS/admin.css">
</head>

<body>

    <header class="navbar">

        <div class="logo-section">
            <div class="logo"></div>
            <h2>CampusConnect</h2>
        </div>

        <nav class="nav-links"> 
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="admin-Materials.html">Materials</a>
            <a href="admin-events.html">Events</a>
        
            <a href="admin.html" class="active">Notice</a>
        </nav>

        <div class="user-section">
            <span>Admin</span>
            <a href="login.html" class="logout">Logout</a>
        </div>

    </header>

    <main class="main">

        <h1>Admin Panel</h1>

        <p class="subtitle">
            Manage campus notices and announcements.
        </p>

        <div class="stats">

            <div class="stat-card">
                <h3>Total Notices</h3>
                <p id="totalNotices">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Materials</h3>
                <p>5</p>
            </div>

            <div class="stat-card">
                <h3>Total Events</h3>
                <p>3</p>
            </div>

        </div>

        <div class="admin-box">

            <h2>Post Notice</h2>

            <form onsubmit="return postNotice()">

                <label for="noticeTitle">Notice Title</label>
                <input type="text" id="noticeTitle" required>

                <label for="noticeCategory">Category</label>
                <select id="noticeCategory" required>
                    <option value="">Select Category</option>
                    <option value="Exam">Exam</option>
                    <option value="Event">Event</option>
                    <option value="General">General</option>
                </select>

                <label for="noticeMessage">Message</label>
                <textarea id="noticeMessage" rows="5" required></textarea>

                <div class="checkbox-row">
                    <input type="checkbox" id="noticeImportant">
                    <label for="noticeImportant">Mark as Important</label>
                </div>

                <button type="submit" class="post-btn">
                    Post Notice
                </button>

            </form>

        </div>

        <div class="admin-box">

            <h2>All Notices</h2>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Important</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="noticeTable"></tbody>
                </table>
            </div>

        </div>

    </main>

    <script src="../JavaScript/admin.js"></script>

</body>
</html>
